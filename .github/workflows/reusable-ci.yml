name: reusable-ci

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
        description: "Nome do serviço/pasta (ex: auth-service) e também nome do repo ECR"
      language:
        required: true
        type: string
        description: "go ou python"
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: false # AWS Academy usa credenciais temporárias com session token

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ${{ inputs.service_name }}

jobs:
  # ---------------------------------------------------------------------
  build_and_test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Setup Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build & test (Go)
        if: inputs.language == 'go'
        run: |
          go mod tidy
          go build ./...
          go test ./... || echo "Sem testes unitários ainda - ajuste quando existirem"

      - name: Install deps & test (Python)
        if: inputs.language == 'python'
        run: |
          pip install -r requirements.txt
          pip install pytest
          pytest || echo "Sem testes unitários ainda - ajuste quando existirem"

  # ---------------------------------------------------------------------
  lint:
    name: Linter / Static Analysis
    runs-on: ubuntu-latest
    needs: build_and_test
    defaults:
      run:
        working-directory: ${{ inputs.service_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: golangci-lint
        if: inputs.language == 'go'
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: ${{ inputs.service_name }}
          version: v2.13.2
          args: --timeout=5m

      - name: Setup Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: flake8
        if: inputs.language == 'python'
        run: |
          pip install flake8
          flake8 . --max-line-length=120 --exit-zero # troque exit-zero por falha real quando o código estiver limpo

  # ---------------------------------------------------------------------
  security_scan:
    name: "Security Scan (SAST & SCA)"
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: ${{ inputs.service_name }}
    steps:
      - uses: actions/checkout@v4

      # SCA - dependências vulneráveis (filesystem scan)
      - name: Trivy SCA (filesystem)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.service_name }}
          severity: CRITICAL,HIGH
          exit-code: "1" # falha o pipeline se achar CRITICAL/HIGH
          format: table

      # SAST - Go
      - name: Setup Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: gosec (SAST Go)
        if: inputs.language == 'go'
        uses: securego/gosec@master
        with:
          args: -severity high -confidence high ./...

      # SAST - Python
      - name: bandit (SAST Python)
        if: inputs.language == 'python'
        run: |
          pip install bandit
          bandit -r . -ll # -ll = só reporta severidade média/alta, falha se encontrar

  # ---------------------------------------------------------------------
  docker_build_and_push:
    name: Docker Build, Scan & Push (ECR)
    runs-on: ubuntu-latest
    needs: security_scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        run: echo "image_tag=v1.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build da imagem
        run: |
          docker build -t $ECR_REPOSITORY:${{ steps.vars.outputs.image_tag }} ./${{ inputs.service_name }}

      - name: Container Scan (Trivy image)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.image_tag }}
          severity: CRITICAL
          exit-code: "1"
          format: table

      - name: Tag & Push pro ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker tag $ECR_REPOSITORY:${{ steps.vars.outputs.image_tag }} $ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.vars.outputs.image_tag }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.vars.outputs.image_tag }}

  # ---------------------------------------------------------------------
  update_gitops:
    name: Atualiza tag no repositório GitOps
    runs-on: ubuntu-latest
    needs: docker_build_and_push
    permissions:
      contents: write # necessário pra dar commit/push na pasta gitops/ deste mesmo repo
    steps:
      - name: Checkout deste repositório (contém a pasta gitops/)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instala yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Atualiza a tag da imagem no manifesto GitOps
        run: |
          FILE="gitops/apps/${{ inputs.service_name }}/deployment.yaml"
          NEW_IMAGE="$(yq '.spec.template.spec.containers[0].image' "$FILE" | cut -d: -f1):${{ needs.docker_build_and_push.outputs.image_tag }}"
          yq -i ".spec.template.spec.containers[0].image = \"$NEW_IMAGE\"" "$FILE"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/${{ inputs.service_name }}/deployment.yaml
          git commit -m "chore(gitops): atualiza ${{ inputs.service_name }} para ${{ needs.docker_build_and_push.outputs.image_tag }}" || echo "Nada para commitar"
          git push
