apiVersion: v1
kind: ServiceAccount
metadata:
  name: observability-actions
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: observability-actions
  namespace: togglemaster
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["auth-service", "evaluation-service"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observability-actions
  namespace: togglemaster
subjects:
  - kind: ServiceAccount
    name: observability-actions
    namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: observability-actions
