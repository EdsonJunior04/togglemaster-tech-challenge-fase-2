# Modelo de referência - NUNCA commite o arquivo real com valores reais.
# Secrets ficam FORA do GitOps automatizado (mesma decisão da Fase 2):
# aplique manualmente com `kubectl apply -f secrets.yaml` uma vez por sessão
# de lab (credenciais do AWS Academy são temporárias e expiram).
apiVersion: v1
kind: Secret
metadata:
  name: togglemaster-secrets
  namespace: togglemaster
type: Opaque
stringData:
  MASTER_KEY: "troque-esta-chave"
  SERVICE_API_KEY: "tm_key_gerada_pelo_auth_service"
  AUTH_DATABASE_URL: "postgres://usuario:senha@ENDPOINT_RDS_AUTH:5432/auth_db"
  FLAG_DATABASE_URL: "postgres://usuario:senha@ENDPOINT_RDS_FLAG:5432/flag_db"
  TARGETING_DATABASE_URL: "postgres://usuario:senha@ENDPOINT_RDS_TARGETING:5432/targeting_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: togglemaster
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "COLE_AQUI"
  AWS_SECRET_ACCESS_KEY: "COLE_AQUI"
  AWS_SESSION_TOKEN: "COLE_AQUI"
