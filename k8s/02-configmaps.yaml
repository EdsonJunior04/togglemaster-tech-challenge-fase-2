apiVersion: v1
kind: ConfigMap
metadata:
  name: togglemaster-config
  namespace: togglemaster
data:
  AWS_REGION: us-east-1
  AWS_DYNAMODB_TABLE: ToggleMasterAnalytics
  AWS_SQS_URL: https://sqs.us-east-1.amazonaws.com/463543537600/togglemaster-analytics-queue
  SQS_WORKER_ENABLED: "true"
  CREATE_DYNAMODB_TABLE_IF_NOT_EXISTS: "false"

  REDIS_URL: rediss://clustercfg.togglemaster-redis.exmyej.use1.cache.amazonaws.com:6379

  AUTH_SERVICE_URL: http://auth-service:8001
  FLAG_SERVICE_URL: http://flag-service:8002
  TARGETING_SERVICE_URL: http://targeting-service:8003

  AUTH_PORT: "8001"
  FLAG_PORT: "8002"
  TARGETING_PORT: "8003"
  EVALUATION_PORT: "8004"
  ANALYTICS_PORT: "8005"