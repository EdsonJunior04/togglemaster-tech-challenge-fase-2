apiVersion: batch/v1
kind: Job
metadata:
  name: auth-db-init
  namespace: togglemaster
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: postgres:16-alpine
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: togglemaster-secrets
                  key: AUTH_DATABASE_URL
          command: ["sh", "-c"]
          args:
            - psql "$DATABASE_URL" -f /sql/init.sql
          volumeMounts:
            - name: sql
              mountPath: /sql
      volumes:
        - name: sql
          configMap:
            name: auth-db-init-sql