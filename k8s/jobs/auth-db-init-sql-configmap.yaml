apiVersion: v1
data:
  init.sql: "CREATE TABLE IF NOT EXISTS api_keys (\r\n    id SERIAL PRIMARY KEY,\r\n
    \   name VARCHAR(100) NOT NULL,\r\n    \r\n    -- key_hash armazena o hash SHA-256
    da chave, que tem 64 caracteres hexadecimais\r\n    key_hash VARCHAR(64) NOT NULL
    UNIQUE, \r\n    \r\n    is_active BOOLEAN DEFAULT true,\r\n    created_at TIMESTAMP
    WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP\r\n);"
kind: ConfigMap
metadata:
  name: auth-db-init-sql
  namespace: togglemaster
