apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: togglemaster-observability
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.18.0
      helm:
        releaseName: togglemaster-observability
        valueFiles:
          - $values/gitops/observability/kube-prometheus-stack-values.yaml
    - repoURL: https://github.com/Pedroxzz/togglemaster-tech-challenge-fase-4.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
