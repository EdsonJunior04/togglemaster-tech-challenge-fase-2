apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-actions
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Pedroxzz/togglemaster-tech-challenge-fase-4.git
    targetRevision: main
    path: gitops/apps/observability-actions
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
