apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: togglemaster-bootstrap
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # sincroniza ANTES dos 5 microsserviços
spec:
  project: default
  source:
    repoURL: https://github.com/EdsonJunior04/togglemaster-tech-challenge-fase-2.git
    targetRevision: main
    path: gitops/bootstrap
  destination:
    server: https://kubernetes.default.svc
    namespace: togglemaster
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
