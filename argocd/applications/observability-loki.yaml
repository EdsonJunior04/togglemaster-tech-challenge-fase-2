apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: togglemaster-loki
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 7.5.0
      helm:
        releaseName: loki
        valueFiles:
          - $values/gitops/observability/loki-values.yaml
    - repoURL: https://github.com/Pedroxzz/togglemaster-tech-challenge-fase-4.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
